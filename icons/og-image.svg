<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient matching icon -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2e3f"/>
      <stop offset="50%" stop-color="#0d4f5a"/>
      <stop offset="100%" stop-color="#063b3b"/>
    </linearGradient>

    <!-- Top shine -->
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="0.5">
      <stop offset="0%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Bolt gradient -->
    <linearGradient id="bolt" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#67f0e0"/>
      <stop offset="100%" stop-color="#00c9a7"/>
    </linearGradient>

    <!-- Energy ring gradient -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5cc" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5cc" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Glow behind bolt -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#00e5cc" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#00b4d8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>

    <!-- Bolt effects -->
    <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00e5cc" flood-opacity="0.4"/>
    </filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Accent line gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5cc"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#shine)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.03" stroke="white" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
  </g>

  <!-- Right side: icon element -->
  <g transform="translate(920, 290)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="180" fill="url(#glow)"/>

    <!-- Energy ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#ring)" stroke-width="1.5"/>

    <!-- Lightning bolt -->
    <g filter="url(#bloom)">
      <path d="M-8,-110 L42,-110 L15,-17 L55,-17 L-17,110 L4,12 L-38,12 Z"
            fill="url(#bolt)" filter="url(#boltShadow)"/>
      <path d="M-1,-100 L34,-100 L12,-22 L0,-22 Z" fill="white" opacity="0.3"/>
    </g>

    <!-- kWh below bolt -->
    <text x="0" y="195" text-anchor="middle"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
          font-size="36" font-weight="800" fill="white" opacity="0.7" letter-spacing="6">kWh</text>
  </g>

  <!-- Left side: text content -->

  <!-- SIEMENS branding -->
  <text x="80" y="175" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#00e5cc" letter-spacing="6" opacity="0.9">SIEMENS</text>

  <!-- Main title -->
  <text x="80" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="68" font-weight="800" fill="white">EV kWh</text>
  <text x="80" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="68" font-weight="800" fill="white">Reimbursement</text>

  <!-- Accent line -->
  <rect x="80" y="390" width="160" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="80" y="435" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="22" fill="#80d4d4" opacity="0.85">Calculate, track, and export your EV charging costs</text>

  <!-- Feature tags -->
  <g transform="translate(80, 490)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="65" y="22" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#a0e0e0">Billing History</text>

    <rect x="145" y="0" width="120" height="34" rx="17" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="205" y="22" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#a0e0e0">Rate Presets</text>

    <rect x="280" y="0" width="120" height="34" rx="17" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="340" y="22" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#a0e0e0">PDF Receipts</text>

    <rect x="415" y="0" width="90" height="34" rx="17" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="460" y="22" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#a0e0e0">Trends</text>
  </g>
</svg>