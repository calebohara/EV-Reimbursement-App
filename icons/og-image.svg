<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004040"/>
      <stop offset="100%" stop-color="#006666"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00cccc"/>
      <stop offset="100%" stop-color="#009999"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>
  <!-- Decorative circle -->
  <circle cx="950" cy="315" r="200" fill="none" stroke="#00cccc" stroke-width="2" opacity="0.15"/>
  <circle cx="950" cy="315" r="140" fill="none" stroke="#00cccc" stroke-width="1.5" opacity="0.1"/>
  <!-- EV icon -->
  <g transform="translate(890, 255)">
    <rect x="0" y="30" width="120" height="60" rx="15" fill="url(#accent)" opacity="0.9"/>
    <rect x="15" y="20" width="90" height="40" rx="10" fill="url(#accent)" opacity="0.9"/>
    <circle cx="30" cy="90" r="12" fill="#004040" stroke="#00cccc" stroke-width="3"/>
    <circle cx="90" cy="90" r="12" fill="#004040" stroke="#00cccc" stroke-width="3"/>
    <!-- Lightning bolt -->
    <polygon points="70,10 55,45 65,45 50,80 80,35 68,35 80,10" fill="#ffd700"/>
  </g>
  <!-- SIEMENS branding -->
  <text x="80" y="180" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#009999" letter-spacing="6">SIEMENS</text>
  <!-- Main title -->
  <text x="80" y="280" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">EV kWh</text>
  <text x="80" y="360" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">Reimbursement</text>
  <!-- Subtitle -->
  <text x="80" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#80dddd">Calculate, track, and export your EV charging costs</text>
  <!-- Bottom bar -->
  <rect x="80" y="480" width="120" height="4" rx="2" fill="#00cccc"/>
  <text x="80" y="520" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#80bbbb">Billing History &#x2022; Rate Presets &#x2022; PDF Receipts &#x2022; Trends</text>
  <!-- Version badge -->
  <rect x="80" y="550" width="60" height="24" rx="12" fill="#00cccc" opacity="0.3"/>
  <text x="110" y="567" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">v2.1</text>
</svg>
