<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#005050"/>
      <stop offset="100%" stop-color="#003333"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e8f0f0"/>
      <stop offset="100%" stop-color="#c8dada"/>
    </linearGradient>
    <linearGradient id="carRoof" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dceaea"/>
    </linearGradient>
    <linearGradient id="windowGlass" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#40d0d0"/>
      <stop offset="100%" stop-color="#007777"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FFF7A0"/>
      <stop offset="30%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <radialGradient id="wheelOuter" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <radialGradient id="wheelHub" cx="0.4" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="100%" stop-color="#444"/>
    </radialGradient>
    <filter id="carShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#001a1a" flood-opacity="0.5"/>
    </filter>
    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Decorative circle glow -->
    <radialGradient id="circleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#009999" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#009999" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glassShine)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="920" cy="315" r="220" fill="url(#circleGlow)"/>
  <circle cx="920" cy="315" r="200" fill="none" stroke="#00cccc" stroke-width="1.5" opacity="0.1"/>
  <circle cx="920" cy="315" r="140" fill="none" stroke="#00cccc" stroke-width="1" opacity="0.07"/>

  <!-- ══ 3D CAR (matching app icon style) ══ -->
  <g transform="translate(920, 300)">
    <!-- Ground shadow -->
    <ellipse cx="0" cy="70" rx="110" ry="10" fill="#001a1a" opacity="0.4"/>

    <!-- Car group with shadow -->
    <g filter="url(#carShadow)">
      <!-- Car body -->
      <path d="M-100,22 Q-106,22 -106,13 L-106,-4 L-75,-49 Q-66,-63 -50,-63 L50,-63 Q66,-63 75,-49 L106,-4 L106,13 Q106,22 99,22 Z"
            fill="url(#carBody)"/>
      <!-- Body highlight stripe -->
      <path d="M-100,3 L-75,-43 Q-66,-56 -50,-56 L50,-56 Q66,-56 75,-43 L100,3"
            fill="none" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
      <!-- Roof -->
      <path d="M-46,-63 L-27,-95 Q-23,-102 -14,-102 L22,-102 Q30,-102 34,-95 L54,-63"
            fill="url(#carRoof)"/>
      <!-- Roof highlight -->
      <path d="M-39,-65 L-24,-91 Q-20,-97 -13,-97 L20,-97 Q27,-97 31,-91 L46,-65"
            fill="white" opacity="0.3"/>
      <!-- Left window -->
      <path d="M-39,-59 L-24,-87 Q-21,-92 -16,-92 L4,-92 L4,-59 Z"
            fill="url(#windowGlass)" opacity="0.7"/>
      <path d="M-32,-59 L-22,-79 L-18,-79 L-28,-59 Z" fill="white" opacity="0.25"/>
      <!-- Right window -->
      <path d="M11,-59 L11,-92 L25,-92 Q32,-92 36,-86 L49,-59 Z"
            fill="url(#windowGlass)" opacity="0.7"/>
      <path d="M16,-59 L16,-79 L20,-79 L20,-59 Z" fill="white" opacity="0.2"/>
      <!-- Door line -->
      <line x1="6" y1="-59" x2="6" y2="18" stroke="#b0c8c8" stroke-width="1" opacity="0.5"/>
      <!-- Headlight -->
      <ellipse cx="100" cy="0" rx="9" ry="6" fill="white" opacity="0.85"/>
      <ellipse cx="100" cy="0" rx="6" ry="4" fill="#ccffff"/>
      <!-- Tail light -->
      <rect x="-106" y="-6" width="6" height="10" rx="2" fill="#ff4444" opacity="0.8"/>

      <!-- Left wheel -->
      <circle cx="-61" cy="25" r="22" fill="url(#wheelOuter)"/>
      <circle cx="-61" cy="25" r="14" fill="url(#wheelHub)"/>
      <circle cx="-61" cy="25" r="6" fill="#222"/>
      <circle cx="-61" cy="25" r="3" fill="#666"/>
      <g stroke="#666" stroke-width="1.5" opacity="0.4">
        <line x1="-61" y1="13" x2="-61" y2="37"/>
        <line x1="-73" y1="25" x2="-49" y2="25"/>
      </g>

      <!-- Right wheel -->
      <circle cx="61" cy="25" r="22" fill="url(#wheelOuter)"/>
      <circle cx="61" cy="25" r="14" fill="url(#wheelHub)"/>
      <circle cx="61" cy="25" r="6" fill="#222"/>
      <circle cx="61" cy="25" r="3" fill="#666"/>
      <g stroke="#666" stroke-width="1.5" opacity="0.4">
        <line x1="61" y1="13" x2="61" y2="37"/>
        <line x1="49" y1="25" x2="73" y2="25"/>
      </g>

      <!-- Bumper detail -->
      <rect x="-86" y="16" width="172" height="4" rx="2" fill="#b8d4d4" opacity="0.25"/>
    </g>

    <!-- Lightning bolt -->
    <g filter="url(#boltGlow)" transform="translate(0, -110)">
      <path d="M-14,-38 L9,-38 L4,-8 L17,-8 L-9,38 L-4,8 L-17,8 Z"
            fill="url(#boltGrad)" stroke="#FFB800" stroke-width="1" stroke-linejoin="round"/>
      <path d="M-10,-32 L5,-32 L1,-8 L-4,-8 Z" fill="white" opacity="0.3"/>
    </g>
  </g>

  <!-- ══ TEXT CONTENT ══ -->
  <!-- SIEMENS branding -->
  <text x="80" y="180" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#00b3b3" letter-spacing="6">SIEMENS</text>

  <!-- Main title with subtle 3D -->
  <text x="80" y="282" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#002a2a" opacity="0.4">EV kWh</text>
  <text x="80" y="280" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">EV kWh</text>

  <text x="80" y="362" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#002a2a" opacity="0.4">Reimbursement</text>
  <text x="80" y="360" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">Reimbursement</text>

  <!-- Subtitle -->
  <text x="80" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#80dddd">Calculate, track, and export your EV charging costs</text>

  <!-- Bottom bar -->
  <rect x="80" y="480" width="120" height="4" rx="2" fill="#00cccc"/>
  <text x="80" y="520" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#80bbbb">Billing History &#x2022; Rate Presets &#x2022; PDF Receipts &#x2022; Trends</text>
</svg>
