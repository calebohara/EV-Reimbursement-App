<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background: matches app dark theme -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12112a"/>
    </linearGradient>

    <!-- Ambient glow: teal radiance (right side, behind bolt) -->
    <radialGradient id="ambientGlow" cx="0.78" cy="0.46" r="0.35">
      <stop offset="0%" stop-color="#009999" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#009999" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#009999" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary glow: subtle warmth bottom-left -->
    <radialGradient id="secondGlow" cx="0.15" cy="0.85" r="0.45">
      <stop offset="0%" stop-color="#16213e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#16213e" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass shine across top -->
    <linearGradient id="glassShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.07"/>
      <stop offset="35%" stop-color="white" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Bolt gradient: white to Siemens teal -->
    <linearGradient id="bolt" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#b2fff5"/>
      <stop offset="65%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#009999"/>
    </linearGradient>

    <!-- Bolt inner highlight -->
    <linearGradient id="boltHighlight" x1="0.3" y1="0" x2="0.7" y2="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ring gradient -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#009999" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00b3b3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#009999" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Bolt glow filter -->
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#009999" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bloom for bolt -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Accent line gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#009999"/>
      <stop offset="60%" stop-color="#00d4aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#009999" stop-opacity="0"/>
    </linearGradient>

    <!-- Tag pill background -->
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#ambientGlow)"/>
  <rect width="1200" height="630" fill="url(#secondGlow)"/>
  <rect width="1200" height="630" fill="url(#glassShine)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Subtle grid lines -->
  <g opacity="0.025" stroke="white" stroke-width="0.5">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
  </g>

  <!-- Right side: icon element -->
  <g transform="translate(920, 280)">
    <!-- Energy ring (outer) -->
    <circle cx="0" cy="0" r="155" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.7"/>

    <!-- Energy ring (inner, dashed) -->
    <circle cx="0" cy="0" r="125" fill="none" stroke="#009999" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="4 8"/>

    <!-- Lightning bolt — centered on ring origin -->
    <g filter="url(#boltGlow)">
      <path d="M-19,-115 L36,-115 L8,-18 L49,-18 L-27,115 L-4,14 L-49,14 Z"
            fill="url(#bolt)"/>
      <!-- Face highlight -->
      <path d="M-12,-105 L27,-105 L5,-25 L-8,-25 Z"
            fill="url(#boltHighlight)"/>
    </g>

    <!-- kWh below bolt -->
    <g filter="url(#textGlow)">
      <text x="0" y="195" text-anchor="middle"
            font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif"
            font-size="38" font-weight="800" fill="white" opacity="0.8" letter-spacing="8">kWh</text>
    </g>

    <!-- Tiny teal dot accent -->
    <circle cx="0" cy="218" r="2.5" fill="#009999" opacity="0.5"/>
  </g>

  <!-- Left side: text content -->

  <!-- SIEMENS branding -->
  <text x="85" y="175"
        font-family="Arial,Helvetica,sans-serif"
        font-size="22" font-weight="bold" fill="#009999" letter-spacing="7" opacity="0.85">SIEMENS</text>

  <!-- Main title -->
  <text x="85" y="275"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif"
        font-size="70" font-weight="800" fill="white">EV kWh</text>
  <text x="85" y="365"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif"
        font-size="70" font-weight="800" fill="white">Reimbursement</text>

  <!-- Accent line -->
  <rect x="85" y="392" width="180" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="85" y="440"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif"
        font-size="21" fill="#66cccc" opacity="0.9">Calculate, track, and export your EV charging costs</text>

  <!-- Feature tags -->
  <g transform="translate(85, 490)">
    <rect x="0" y="0" width="135" height="36" rx="18" fill="url(#pillBg)" stroke="#009999" stroke-opacity="0.15" stroke-width="1"/>
    <text x="67" y="23" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#66cccc">Billing History</text>

    <rect x="150" y="0" width="125" height="36" rx="18" fill="url(#pillBg)" stroke="#009999" stroke-opacity="0.15" stroke-width="1"/>
    <text x="212" y="23" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#66cccc">Rate Presets</text>

    <rect x="290" y="0" width="125" height="36" rx="18" fill="url(#pillBg)" stroke="#009999" stroke-opacity="0.15" stroke-width="1"/>
    <text x="352" y="23" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#66cccc">PDF Receipts</text>

    <rect x="430" y="0" width="100" height="36" rx="18" fill="url(#pillBg)" stroke="#009999" stroke-opacity="0.15" stroke-width="1"/>
    <text x="480" y="23" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#66cccc">EV Impact</text>
  </g>
</svg>