<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b3b3"/>
      <stop offset="100%" stop-color="#007a7a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Car silhouette -->
  <g transform="translate(256,235)">
    <!-- Body -->
    <path d="M-130,45 Q-135,45 -135,35 L-135,10 L-95,-50 Q-85,-65 -65,-65 L65,-65 Q85,-65 95,-50 L135,10 L135,35 Q135,45 125,45 Z" fill="white" opacity="0.95"/>
    <!-- Roof line -->
    <path d="M-60,-65 L-35,-105 Q-30,-112 -20,-112 L30,-112 Q40,-112 45,-105 L70,-65" fill="white" opacity="0.95"/>
    <!-- Windows -->
    <path d="M-50,-60 L-30,-95 Q-28,-100 -20,-100 L5,-100 L5,-60 Z" fill="#009999" opacity="0.5"/>
    <path d="M15,-60 L15,-100 L35,-100 Q43,-100 48,-93 L62,-60 Z" fill="#009999" opacity="0.5"/>
    <!-- Wheels -->
    <circle cx="-80" cy="48" r="26" fill="#1a1a1a"/>
    <circle cx="-80" cy="48" r="16" fill="#444"/>
    <circle cx="-80" cy="48" r="6" fill="#1a1a1a"/>
    <circle cx="80" cy="48" r="26" fill="#1a1a1a"/>
    <circle cx="80" cy="48" r="16" fill="#444"/>
    <circle cx="80" cy="48" r="6" fill="#1a1a1a"/>
  </g>
  <!-- Lightning bolt -->
  <g transform="translate(256,130)">
    <path d="M-18,-55 L12,-55 L5,-10 L22,-10 L-12,55 L-5,10 L-22,10 Z" fill="url(#bolt)"/>
  </g>
  <!-- kWh text -->
  <text x="256" y="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="56" font-weight="700" fill="white" letter-spacing="4" opacity="0.95">kWh</text>
</svg>
