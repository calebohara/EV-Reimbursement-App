<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background: matches app dark theme -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12112a"/>
    </linearGradient>

    <!-- Ambient glow: teal radiance behind bolt -->
    <radialGradient id="ambientGlow" cx="0.5" cy="0.42" r="0.38">
      <stop offset="0%" stop-color="#009999" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#009999" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#009999" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary glow: subtle bottom-right warmth -->
    <radialGradient id="secondGlow" cx="0.7" cy="0.75" r="0.4">
      <stop offset="0%" stop-color="#16213e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#16213e" stop-opacity="0"/>
    </radialGradient>

    <!-- Bolt gradient: white to Siemens teal -->
    <linearGradient id="bolt" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#b2fff5"/>
      <stop offset="65%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#009999"/>
    </linearGradient>

    <!-- Bolt inner highlight -->
    <linearGradient id="boltHighlight" x1="0.3" y1="0" x2="0.7" y2="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glass shine across top -->
    <linearGradient id="glassShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Ring gradient -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#009999" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00b3b3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#009999" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Bolt glow filter -->
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feFlood flood-color="#009999" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft bloom -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- iOS-style rounded rectangle background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ambient glow layers -->
  <rect width="512" height="512" rx="112" fill="url(#ambientGlow)"/>
  <rect width="512" height="512" rx="112" fill="url(#secondGlow)"/>

  <!-- Glass shine overlay -->
  <rect width="512" height="512" rx="112" fill="url(#glassShine)"/>

  <!-- Subtle inset border -->
  <rect x="2" y="2" width="508" height="508" rx="111" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Outer energy ring (subtle) -->
  <circle cx="256" cy="232" r="152" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.7"/>

  <!-- Inner energy ring (faint) -->
  <circle cx="256" cy="232" r="120" fill="none" stroke="#009999" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Lightning bolt — centered on ring (256,232) -->
  <g filter="url(#boltGlow)" transform="translate(256, 232)">
    <path d="M-22,-135 L42,-135 L10,-22 L58,-22 L-32,135 L-4,16 L-58,16 Z"
          fill="url(#bolt)"/>
    <!-- Face highlight -->
    <path d="M-14,-125 L32,-125 L6,-28 L-8,-28 Z"
          fill="url(#boltHighlight)"/>
  </g>

  <!-- kWh label -->
  <g filter="url(#textGlow)">
    <text x="256" y="440" text-anchor="middle"
          font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif"
          font-size="48" font-weight="800" fill="white" opacity="0.85" letter-spacing="10">kWh</text>
  </g>

  <!-- Tiny Siemens teal dot accent -->
  <circle cx="256" cy="460" r="3" fill="#009999" opacity="0.5"/>
</svg>
