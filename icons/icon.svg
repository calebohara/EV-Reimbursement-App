<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep rich gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2e3f"/>
      <stop offset="50%" stop-color="#0d4f5a"/>
      <stop offset="100%" stop-color="#063b3b"/>
    </linearGradient>

    <!-- Subtle top shine -->
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="0.6">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Bolt gradient — bright and vibrant -->
    <linearGradient id="bolt" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#67f0e0"/>
      <stop offset="100%" stop-color="#00c9a7"/>
    </linearGradient>

    <!-- Energy ring gradient -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5cc" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5cc" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Outer glow behind the bolt -->
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.35">
      <stop offset="0%" stop-color="#00e5cc" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00b4d8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>

    <!-- Bolt drop shadow -->
    <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00e5cc" flood-opacity="0.4"/>
    </filter>

    <!-- Subtle bloom on bolt -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- Subtle inner border -->
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Background glow -->
  <circle cx="256" cy="220" r="180" fill="url(#glow)"/>

  <!-- Energy ring -->
  <circle cx="256" cy="240" r="145" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <circle cx="256" cy="240" r="146" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Lightning bolt -->
  <g filter="url(#bloom)" transform="translate(256, 230)">
    <!-- Bold geometric bolt -->
    <path d="M-10,-130 L50,-130 L18,-20 L65,-20 L-20,130 L5,15 L-45,15 Z"
          fill="url(#bolt)" filter="url(#boltShadow)"/>
    <!-- Highlight on bolt face -->
    <path d="M-2,-120 L40,-120 L14,-25 L0,-25 Z" fill="white" opacity="0.35"/>
  </g>

  <!-- Text shadow (rendered first, behind) -->
  <text x="256" y="440" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="50" font-weight="800" fill="#0a2e3f" opacity="0.3" letter-spacing="8">kWh</text>
  <!-- kWh text -->
  <text x="256" y="438" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="50" font-weight="800" fill="white" opacity="0.9" letter-spacing="8">kWh</text>
</svg>